# Forhemit desktop app — Cargo workspace.
#
# Spec: art_fL7Z2ate ("Forhemit Destination-to-Package — the first downloadable
# Rust app"). Layering rule (Standalone Engine Architecture): engine crates
# under `crates/` depend only on `contracts` (the cross-engine vocabulary) and
# `enginekit` (shared runtime kit) — never on each other's internals. The rule
# is enforced by `ci/check_workspace_deps.py` in CI. The `app` shell is the
# composition root: its commands are thin adapters over engine APIs.

[workspace]
resolver = "2"
members = [
    "app/src-tauri",
    "crates/audit",
    "crates/contracts",
    "crates/destination",
    "crates/enginekit",
    "crates/journey",
    "crates/reality",
    "crates/vault",
    "crates/scenario",
    "crates/package",
]

[workspace.package]
version = "0.0.3"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
forhemit-contracts = { path = "crates/contracts" }
forhemit-enginekit = { path = "crates/enginekit" }
aes-gcm = "0.10"
age = "0.11"
argon2 = "0.5"
base64 = "0.23"
keyring = "3"
minisign-verify = "0.2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
sha2 = "0.10"
tauri-plugin-updater = "2"
tempfile = "3"
time = "0.3"
ulid = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
