[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forhemit-release0"
version = "0.1.0"
description = "Deterministic California ESOP exploration workflow core"
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.25.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.unittest]
start-directory = "tests"